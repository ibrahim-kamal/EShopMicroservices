services:
 catalogdb:
  image: postgres:17-alpine

 basketdb:
  image: postgres:17-alpine
 
 distributedcache:
  image: redis

 orderdb:
  image: mcr.microsoft.com/mssql/server
 
 messagebroker:
  image: rabbitmq:4-management

 catelog.api:
   image: ${DOCKER_REGISTRY-}catelogapi
   build:
    context: .
    dockerfile: Services/Catalog/Catelog.API/Dockerfile
 
 basket.api:
  image: ${DOCKER_REGISTRY-}basketapi
  build:
   context: .
   dockerfile: Services/basket/Basket.API/Dockerfile
  

 discount.grpc:
  image: ${DOCKER_REGISTRY-}discountgrpc
  build:
   context: .
   dockerfile: Services/Discount/Discount.Grpc/Dockerfile

 ordering.api:
  image: ${DOCKER_REGISTRY-}orderingapi
  build:
   context: .
   dockerfile: Services/Ordering/Ordering.Api/Dockerfile
      

 yarppapigateway:
  image: ${DOCKER_REGISTRY-}yarppapigateway
  build:
   context: .
   dockerfile: ApiGateways/YarpPApiGateWay/Dockerfile

 shopping.web:
  image: ${DOCKER_REGISTRY-}shoppingweb
  build:
   context: .
   dockerfile: WebApps/Shopping.Web/Dockerfile

volumes:
 postgres_catalog:
 postgres_basket:
 sqlserver_order:
 rabbitmq_data:







