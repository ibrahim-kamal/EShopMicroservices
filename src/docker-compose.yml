services:
 catalogdb:
  image: postgres:17-alpine

 basketdb:
  image: postgres:17-alpine
 
 distributedcache:
  image: redis

 catelog.api:
   image: ${DOCKER_REGISTRY-}catelogapi
   build:
    context: .
    dockerfile: Services/Catalog/Catelog.API/Dockerfile
 
 basket.api:
  image: ${DOCKER_REGISTRY-}basketapi
  build:
   context: .
   dockerfile: Services/basket/Basket.API/Dockerfile
  

volumes:
 postgres_catalog:
 postgres_basket:

